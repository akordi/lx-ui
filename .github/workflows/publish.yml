name: Publish to npm

# Triggered by pushing a version tag (e.g. `v2.3.4-akordi.1`), or manually via
# workflow_dispatch for an ad-hoc publish of a specific ref.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (no leading "v"), e.g. 2.3.4-akordi.1'
        required: true

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing — see docs.npmjs.com/trusted-publishers

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Set up Node (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm CLI >= 11.5.1; GitHub's runners
      # don't always ship that yet.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set package version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build
        run: bun run build

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          # Used only if trusted publishing isn't configured for this
          # workflow yet (see docs.npmjs.com/trusted-publishers) — the npm
          # CLI prefers the OIDC token above and ignores this once it's set
          # up; ignored/unnecessary once it is.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
